name: agent-c

on:
  push:
    branches: [agent-c, main]
  pull_request:

jobs:
  agent-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack (pnpm 9)
        run: corepack enable

      - name: Install
        run: corepack pnpm@9 install --frozen-lockfile

      - name: Prisma generate
        run: corepack pnpm@9 exec prisma generate

      - name: Guard against iCloud duplicate files
        run: |
          DUPES=$(find . -type f \( -name "* 2.ts" -o -name "* 2.tsx" -o -name "* 2.json" \) -not -path "./node_modules/*" -not -path "./.next/*" -print)
          if [ -n "$DUPES" ]; then echo "iCloud duplicates present:"; echo "$DUPES"; exit 1; fi

      - name: Typecheck
        run: corepack pnpm@9 exec tsc --noEmit

      # Gate 2 (contract) + Gate 3 (behavioral) + coverage floor (95% on the
      # compliance critical paths). No live DB needed — the decision logic is
      # unit-tested with injected fakes. Gate 1 live-boot (migrate deploy + seed
      # + curl) runs separately with Doppler secrets — see src/lib/compliance/README.md.
      - name: Test + coverage floor
        run: corepack pnpm@9 exec vitest run --config vitest.agent-c.config.ts --coverage
