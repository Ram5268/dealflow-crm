name: ci

# Repo-wide CI. Was `agent-c.yml`, which triggered on the now-merged `agent-c`
# branch and ran only that slice's vitest config — so the 237-test comms suite
# was never covered in CI at all.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          # v5 flipped this on by default and auto-detects the package manager
          # from `packageManager: pnpm@…`, but corepack enables pnpm on the NEXT
          # step — so the cache probe runs before pnpm exists and the job dies
          # with "Unable to locate executable file: pnpm". v4 only cached when
          # asked; this restores that.
          package-manager-cache: false

      - name: Enable corepack (pnpm 9)
        run: corepack enable

      - name: Install
        run: corepack pnpm@9 install --frozen-lockfile

      - name: Prisma generate
        run: corepack pnpm@9 exec prisma generate

      - name: Typecheck
        # The default ~2GB V8 heap OOMs on this project — every CI run since the
        # workflow was added died here (`FATAL ERROR: Reached heap limit`), so no
        # step after this one had ever executed. ubuntu-latest has 16GB.
        run: corepack pnpm@9 exec tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Test — comms suite
        # `scripts/test-all.sh` runs two suites. This one (suite 2) is fully
        # mocked (vi.mock on prisma, fetch stubs) — no DB. Suite 1, the
        # DB-backed one, runs in the `db-suite` job below.
        run: corepack pnpm@9 exec vitest run --config vitest.agent-d.config.ts

  db-suite:
    # Brief 41.1 (PR B): suite 1 (vitest.config.ts, the DB-backed tests) on a
    # throwaway Postgres that exists only for this job, instead of the shared
    # Railway perf DB (which drops connections and is shared with local runs).
    # The job has no secrets, so it can't reach the live CRM. The tests' guard
    # (src/lib/shared/db-guard.ts) refuses any database whose name doesn't end
    # in _perf / _test, and the setup step below runs the same check first.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: dealflow_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d dealflow_crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Suite 1's own database: globalSetup pushes the schema here.
      DATABASE_URL_PERF: postgresql://crm:crm@localhost:5432/dealflow_crm_test
      # tests/integration-local/* run only when DATABASE_URL_MAIN is a test
      # database, so they get a second one (no rows shared with the rest of
      # suite 1).
      DATABASE_URL_MAIN: postgresql://crm:crm@localhost:5432/dealflow_crm_main_test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false # see the `ci` job

      - name: Enable corepack (pnpm 9)
        run: corepack enable

      - name: Install
        run: corepack pnpm@9 install --frozen-lockfile

      - name: Prisma generate
        run: corepack pnpm@9 exec prisma generate

      - name: Create the integration-local database
        run: psql "$DATABASE_URL_PERF" -c 'CREATE DATABASE dealflow_crm_main_test'

      - name: Schema + singleton org for the integration-local suites
        # The datasource is env("DATABASE_URL_MAIN"), so this pushes to the
        # second test database. seed-main upserts the dealflow-ryan org and
        # user those suites look up. Neither has a guard of its own, so the
        # live-database check runs first.
        run: |
          corepack pnpm@9 exec tsx scripts/assert-test-db.ts DATABASE_URL_MAIN db-suite-setup
          corepack pnpm@9 exec prisma db push --skip-generate
          corepack pnpm@9 exec tsx scripts/seed-main.ts

      - name: Test — DB-backed suite (suite 1)
        # tests/perf/25k needs a 25k-lead seed, which this database doesn't have.
        run: corepack pnpm@9 exec vitest run --exclude tests/perf/25k.test.ts
